<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="520" height="400" viewBox="0 0 520 400"
     font-family="SimSun, 'Times New Roman', serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#ffffff"/>

  <!-- 齿廓曲线 -->
  <path d="M 90,76
           L 228,76
           C 238,82 250,96 258,112
           C 268,132 270,148 270,162
           C 271,174 280,184 296,188
           L 358,188"
        fill="none" stroke="#000" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 修形曲线示意 -->
  <path d="M 168,76
           C 195,80 225,90 252,108"
        fill="none" stroke="#000" stroke-width="1.2"
        stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- 特征点 -->
  <g fill="#000">
    <circle cx="90"  cy="76"  r="2.5"/>
    <circle cx="228" cy="76"  r="2.5"/>
    <circle cx="168" cy="76"  r="2.5"/>
    <circle cx="270" cy="162" r="2.5"/>
    <circle cx="296" cy="188" r="2.5"/>
  </g>

  <!-- 点标注 -->
  <g font-size="15" font-style="italic" fill="#000">
    <text x="76"  y="72">A</text>
    <text x="232" y="70">B</text>
    <text x="154" y="70">F</text>
    <text x="256" y="158">C</text>
    <text x="301" y="184">D</text>
  </g>

  <!-- 中文标注 -->
  <g font-size="14" fill="#000">
    <line x1="158" y1="52" x2="158" y2="74"
          stroke="#000" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="100" y="48">齿顶圆弧</text>

    <line x1="118" y1="105" x2="188" y2="84"
          stroke="#000" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="48" y="110">修形曲线</text>

    <line x1="318" y1="98" x2="278" y2="118"
          stroke="#000" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="323" y="95">工作齿廓</text>

    <line x1="348" y1="168" x2="302" y2="172"
          stroke="#000" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="353" y="166">过渡曲线</text>

    <line x1="408" y1="204" x2="355" y2="190"
          stroke="#000" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="413" y="208">齿根圆角</text>
  </g>

  <!-- 图题 -->
  <text x="260" y="368" font-size="14" text-anchor="middle" fill="#000">
    图 3-1 齿轮齿廓组成示意图
  </text>

</svg>